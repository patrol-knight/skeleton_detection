# Milestone 2: RealSense D456 captured directly inside the RTMO process.
# No realsense2_camera node, no sensor_msgs/Image on the input path.
rtmo_node:
  ros__parameters:
    input_mode: realsense

    # --- camera (validated against the device's advertised profiles at
    # startup; an unsupported combination fails with the supported list
    # instead of being silently substituted) ---
    realsense_width: 848
    realsense_height: 480
    realsense_fps: 60
    # D456 advertises bgr8 natively at this profile, which is exactly what the
    # RTMO config expects, so no per-frame colour conversion is done.
    realsense_color_format: bgr8
    realsense_serial: ""          # empty = first device found
    camera_frame_id: camera_color_optical_frame

    # --- output ---
    output_topic: /skeleton_detection/frame

    # --- model ---
    # Baked into the Docker image by docker/fetch_models.py; override
    # these if you want to run a different config/checkpoint.
    model_config: /opt/models/rtmo/rtmo-m.py
    checkpoint: /opt/models/rtmo/rtmo-m.pth
    device: cuda:0
    person_score_threshold: 0.3

    # --- tracking: BoT-SORT + OSNet ReID, in this same process ---
    # OFF by default: it costs throughput and changes person_id semantics.
    # When enabled, PersonSkeleton.person_id becomes a PERSISTENT track id
    # instead of the frame-local detection index.
    enable_tracking: false
    with_reid: true
    reid_checkpoint: /opt/models/reid/osnet_x0_25_msmt17.pt
    # <=0 uses the measured pipeline rate (~55 Hz), NOT the 60 Hz camera rate:
    # the capture buffer is latest-frame-wins, so the tracker only sees the
    # frames RTMO actually processed. This scales BoT-SORT's track buffer.
    tracking_frame_rate: 0.0
    # 'none' disables camera-motion compensation (right for a static camera).
    # Other options: ecc, orb, sift, sof.
    cmc_method: "none"

    # --- visualisation: human-facing only, OFF by default for performance ---
    # Enable with: -p publish_visualization_image:=true
    # The visualization topic is rate limited and downscaled independently of
    # /skeleton_detection/frame, which always runs at the full pipeline rate.
    publish_visualization_image: false
    visualization_topic: /skeleton_detection/visualization_image
    visualization_width: 424
    visualization_height: 240
    visualization_fps: 10.0
    # 'best_effort' suits a live stream (stale frames dropped). Switch to
    # 'reliable' if a viewer subscribes with reliable QoS and sees nothing.
    visualization_reliability: best_effort
    draw_joint_scores: false
    joint_score_threshold: 0.3
    # Offline artefact: writes a file for EVERY processed frame (not rate
    # limited). Keep false during live runs.
    save_visualization_images: false

    # --- logging ---
    stats_log_period_sec: 1.0     # periodic summary instead of per-frame logs
    log_every_frame: false
    run_duration_sec: 0.0         # >0 = stop automatically (benchmark runs)
