services:
  skeleton_humble:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Override to run another tag, e.g. SKELETON_IMAGE=skeleton_detection:v2.1-local
    image: ${SKELETON_IMAGE:-skeleton_humble_dev}

    container_name: skeleton_humble

    command:
      [
        "ros2",
        "launch",
        "skeleton_detection",
        "skeleton_detection_bringup.launch.py",
        "config:=/config/skeleton_detection_node.yaml"
      ]

    working_dir: /ros2_ws

    # Headless and unprivileged: in the default ros_camera deployment the
    # camera (ZED + RGBD adapter, or realsense2_camera) is owned by the IoT
    # stack and this container only subscribes to its RGBD topic, so it needs
    # no device access and no display. GPU access comes from the `deploy`
    # block below, not from privileged mode. Direct `input_mode: realsense`
    # needs extra device access -- see docs/docker.md.

    # Same DDS setup as the IoT containers: host network + host IPC, and a
    # Fast DDS profile whose 64 MB shared-memory segments fit a whole RGBD
    # frame. With Fast DDS defaults the RGBD messages do not arrive.
    network_mode: host
    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # No source mount: the image runs its own built-in install of this
    # package. Only the deployment config is mounted, so it can be edited or
    # swapped without rebuilding the image.
    volumes:
      - ./config/skeleton_detection_node.yaml:/config/skeleton_detection_node.yaml:ro
      - ./docker/fastdds.xml:/config/fastdds.xml:ro

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /config/fastdds.xml
